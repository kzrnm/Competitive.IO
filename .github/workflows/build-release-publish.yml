name: Build-Release-Publish

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  WORKFLOW_BUILD_SLN: Competitive.IO.slnx

jobs:
  get-version:
    uses: kzrnm/dotnet-actions/.github/workflows/get-version.yml@v2
    with:
      project-path: Directory.Build.props

  build:
    runs-on: windows-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
            6.0.x
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build
        run: dotnet build ${{ env.WORKFLOW_BUILD_SLN }} -c Release
      - name: Format
        run: dotnet format ${{ env.WORKFLOW_BUILD_SLN }} --verify-no-changes --no-restore
      - name: Test
        run: dotnet test ${{ env.WORKFLOW_BUILD_SLN }} --no-build --logger GitHubActions -c Release
      - uses: actions/upload-artifact@v7
        if: ${{ needs.get-version.outputs.is-new == 'true' }}
        with:
          name: dist
          path: bin/Packages/Release

  publish:
    runs-on: ubuntu-latest
    needs: [get-version, build]
    if: ${{ needs.get-version.outputs.is-new == 'true' }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: naminodarie
      - name: Publish NuGet & Release
        uses: kzrnm/dotnet-actions/actions/publish@v2
        id: get-version
        with:
          artifact-name: dist
          version: ${{ needs.get-version.outputs.version }}
          is-prerelease: ${{ needs.get-version.outputs.is-prerelease == 'true' }}
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
